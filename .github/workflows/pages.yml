name: Component gallery (GitHub Pages)
# Publishes ONLY the brand-free component gallery (apps/gallery), never a case app:
#   https://mostafabreem.github.io/product-lab/
# Case apps use real product names and payment screens, so they stay off public hosting.
on:
  push:
    branches: [main, case/tabby]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx expo export --platform web
        working-directory: apps/gallery
      - name: Guard - no case brand names in the public bundle
        run: "! grep -r -l -E 'Tabby|تابي|Namshi|Noon' apps/gallery/dist"
      - run: cp apps/gallery/dist/index.html apps/gallery/dist/404.html && touch apps/gallery/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/gallery/dist
  deploy:
    # The github-pages environment only accepts the default branch (main); case branches build and test only.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
