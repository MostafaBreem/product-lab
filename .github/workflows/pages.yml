name: Docs site + case study (GitHub Pages)
# https://mostafabreem.github.io/product-lab/      Storybook docs: foundations, components, rules, agent files
# https://mostafabreem.github.io/product-lab/app/  Tabby case study (web build, fixed "unofficial case study" banner)
on:
  push:
    branches: [main, case/tabby]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tokens up to date with design/tokens.json
        run: npm run tokens && git diff --exit-code packages/app-kit/src/tokens/generated.ts
      - name: Contrast (token pairs, AA)
        run: node packages/app-kit/scripts/contrast.mjs
      - run: npm test
      - name: Docs site (Storybook + llms.txt, tokens.json, components.json)
        run: npm run build
        working-directory: apps/docs
        env:
          SB_BASE: /product-lab/
      - name: Case study app (web)
        run: npx expo export --platform web
        working-directory: apps/tabby
        env:
          EXPO_PUBLIC_CASE_STUDY: '1'
      - name: Assemble site
        run: |
          mkdir site && cp -r apps/docs/dist/. site/ && cp -r apps/tabby/dist site/app
          cp apps/tabby/dist/index.html site/404.html && touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    # The github-pages environment only accepts the default branch (main); case branches build and test only.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
